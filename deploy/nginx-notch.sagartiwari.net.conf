# Paste into aaPanel → Site notch.sagartiwari.net → Config
# (or include from /www/server/panel/vhost/nginx/notch.sagartiwari.net.conf).
# Keep aaPanel's SSL listen blocks; replace the `server { ... }` location body with these.

# API only on loopback — never expose 4391 publicly.
upstream notchos_api {
    server 127.0.0.1:4391;
    keepalive 8;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name notch.sagartiwari.net;

    # aaPanel usually injects ssl_certificate lines here — leave them.

    root /www/wwwroot/notch.sagartiwari.net/public;
    index index.html;

    client_max_body_size 80m;

    # Marketing site (Astro static)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Admin SPA under /admin/ (still mock until W2; UI only)
    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # DMG + other binaries (files live in public/downloads/)
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
        types { application/octet-stream dmg; }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # App license routes
    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://notchos_api;
    }

    # Site trial-lead API (and future public /api/*)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://notchos_api;
    }

    location ~ /\. {
        deny all;
    }
}
